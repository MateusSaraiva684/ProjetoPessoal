services:
  api:
    build: .
    container_name: recognition-api
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://user:password@db:5432/reconhecimento
      - RECOGNITION_API_KEYS=dev-recognition-key
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - SIMILARITY_THRESHOLD=0.75
      - MATCH_AMBIGUITY_MARGIN=${MATCH_AMBIGUITY_MARGIN:-0.02}
      - LOG_LEVEL=INFO
      - MAX_FILE_SIZE_MB=10
      - PHOTO_URL_ALLOWED_HOSTS=${PHOTO_URL_ALLOWED_HOSTS:-res.cloudinary.com}
      - PHOTO_URL_TIMEOUT_SECONDS=${PHOTO_URL_TIMEOUT_SECONDS:-8}
      - USE_GPU=false
      - SAAS_PRESENCE_WEBHOOK_URL=${SAAS_PRESENCE_WEBHOOK_URL:-http://host.docker.internal:8000/api/recognition/presences}
      - SAAS_WEBHOOK_SECRET=${SAAS_WEBHOOK_SECRET:-webhook-secret}
      - SAAS_WEBHOOK_TIMEOUT_SECONDS=${SAAS_WEBHOOK_TIMEOUT_SECONDS:-5}
      - SCHOOL_ID=${SCHOOL_ID:-escola_1}
      - CAMERA_ID=${CAMERA_ID:-entrada_principal}
      - PRESENCE_DEDUP_WINDOW_SECONDS=${PRESENCE_DEDUP_WINDOW_SECONDS:-300}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  migrate:
    build: .
    container_name: recognition-migrate
    command: python scripts/apply_migrations.py
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/reconhecimento
      - LOG_LEVEL=INFO
      - SCHOOL_ID=${SCHOOL_ID:-escola_1}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    build: .
    container_name: recognition-worker
    command: rq worker --url redis://redis:6379 --with-scheduler recognition
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://user:password@db:5432/reconhecimento
      - RECOGNITION_API_KEYS=dev-recognition-key
      - SIMILARITY_THRESHOLD=0.75
      - MATCH_AMBIGUITY_MARGIN=${MATCH_AMBIGUITY_MARGIN:-0.02}
      - LOG_LEVEL=INFO
      - USE_GPU=false
      - SAAS_PRESENCE_WEBHOOK_URL=${SAAS_PRESENCE_WEBHOOK_URL:-http://host.docker.internal:8000/api/recognition/presences}
      - SAAS_WEBHOOK_SECRET=${SAAS_WEBHOOK_SECRET:-webhook-secret}
      - SAAS_WEBHOOK_TIMEOUT_SECONDS=${SAAS_WEBHOOK_TIMEOUT_SECONDS:-5}
      - SCHOOL_ID=${SCHOOL_ID:-escola_1}
      - CAMERA_ID=${CAMERA_ID:-entrada_principal}
      - PRESENCE_DEDUP_WINDOW_SECONDS=${PRESENCE_DEDUP_WINDOW_SECONDS:-300}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7
    container_name: recognition-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: ankane/pgvector
    container_name: recognition-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reconhecimento
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  postgres_data:

networks:
  default:
    name: recognition-network
